<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>MY LIFE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;touch-action:manipulation;overscroll-behavior:none}
:root{--cyan:#00f5ff;--pink:#ff00e5;--purple:#b026ff;--green:#00ff88;--yellow:#ffea00;--red:#ff4466;--bg:#0a0a1a;--card:#12122a;--card2:#1a1a35;--text:#e8e8ff;--dim:#8888aa}
body{background:var(--bg);background-image:radial-gradient(circle at 20% 10%,rgba(176,38,255,.15) 0%,transparent 40%),radial-gradient(circle at 80% 90%,rgba(0,245,255,.12) 0%,transparent 40%);color:var(--text);padding:12px;display:flex;align-items:center;justify-content:center}
.app{width:100%;max-width:500px;height:100%;max-height:100vh;background:var(--card);border-radius:28px;border:1px solid rgba(0,245,255,.15);box-shadow:0 0 60px rgba(176,38,255,.25),0 0 120px rgba(0,245,255,.1);overflow:hidden;display:flex;flex-direction:column;position:relative}
header{background:linear-gradient(135deg,#1a0033,#000033);padding:20px 20px 18px;text-align:center;position:relative;overflow:hidden;border-bottom:1px solid rgba(0,245,255,.2);flex-shrink:0}
header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent 0deg,rgba(0,245,255,.15) 90deg,transparent 180deg,rgba(255,0,229,.15) 270deg,transparent 360deg);animation:rot 12s linear infinite;pointer-events:none}
@keyframes rot{to{transform:rotate(360deg)}}
header>*{position:relative;z-index:1}
header h1{font-size:1.6rem;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--purple));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:200% center}}
header p{opacity:.7;font-size:.75rem;margin-top:4px;color:var(--cyan);letter-spacing:.5px}
header .date{font-size:.7rem;opacity:.55;margin-top:4px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.kid-badge{display:inline-block;margin-top:8px;padding:4px 14px;background:rgba(0,245,255,.1);border:1px solid rgba(0,245,255,.4);border-radius:20px;font-size:.7rem;font-weight:800;color:var(--cyan);letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.kid-badge:active{transform:scale(.95)}
.stats{display:flex;justify-content:space-around;padding:14px 12px;background:var(--card2);border-bottom:1px solid rgba(0,245,255,.1);flex-shrink:0}
.stat{text-align:center;flex:1}
.stat .value{font-size:1.3rem;font-weight:800}
.stat:nth-child(1) .value{color:var(--purple);text-shadow:0 0 20px rgba(176,38,255,.7)}
.stat:nth-child(2) .value{color:var(--cyan);text-shadow:0 0 20px rgba(0,245,255,.7)}
.stat:nth-child(3) .value{color:var(--green);text-shadow:0 0 20px rgba(0,255,136,.7)}
.stat .label{font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px;font-weight:600}
.day-progress{padding:12px 18px;background:var(--card2);border-bottom:1px solid rgba(0,245,255,.1);flex-shrink:0}
.day-progress .bar{height:8px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden;margin-bottom:6px;border:1px solid rgba(0,245,255,.15)}
.day-progress .fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));width:0%;transition:width .6s ease;box-shadow:0 0 15px var(--cyan)}
.day-progress .text{font-size:.68rem;color:var(--dim);text-align:center;font-weight:600;letter-spacing:1px}
.euro-banner{background:linear-gradient(135deg,rgba(255,107,0,.15),rgba(255,234,0,.1));border-bottom:1px solid rgba(255,107,0,.3);color:var(--yellow);padding:12px 16px;text-align:center;font-weight:700;font-size:.78rem;flex-shrink:0;text-shadow:0 0 15px rgba(255,234,0,.5)}
.euro-banner.earned{background:linear-gradient(135deg,rgba(0,255,136,.2),rgba(0,245,255,.15));border-color:rgba(0,255,136,.4);color:var(--green);text-shadow:0 0 20px rgba(0,255,136,.8);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 20px rgba(0,255,136,.1)}50%{box-shadow:inset 0 0 40px rgba(0,255,136,.3)}}
.tabs{display:flex;background:var(--card2);border-bottom:1px solid rgba(0,245,255,.1);padding:4px;gap:4px;flex-shrink:0}
.tab{flex:1;padding:10px 8px;text-align:center;cursor:pointer;font-size:.72rem;font-weight:700;color:var(--dim);border-radius:12px;transition:all .3s;pointer-events:auto}
.tab.active{color:var(--cyan);background:rgba(0,245,255,.08);box-shadow:0 0 20px rgba(0,245,255,.2);text-shadow:0 0 10px rgba(0,245,255,.8)}
.content{padding:14px;flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.section-title{font-size:.65rem;font-weight:800;color:var(--pink);text-transform:uppercase;letter-spacing:2px;margin:12px 0 10px 6px;text-shadow:0 0 10px rgba(255,0,229,.6)}
.section-title:first-child{margin-top:0}
.task{background:var(--card2);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;border:1px solid rgba(0,245,255,.12);position:relative;overflow:hidden;cursor:pointer;pointer-events:auto}
.task::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--cyan),var(--purple));box-shadow:0 0 15px var(--cyan)}
.task.done{opacity:.55;border-color:rgba(0,255,136,.3)}
.task.done::before{background:linear-gradient(180deg,var(--green),var(--cyan));box-shadow:0 0 20px var(--green)}
.task.done .task-title{text-decoration:line-through;text-decoration-color:var(--green)}
.task-check{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,245,255,.4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:transparent;transition:all .3s;background:rgba(0,245,255,.05)}
.task.done .task-check{background:var(--green);border-color:var(--green);color:#000;box-shadow:0 0 20px var(--green);transform:scale(1.05)}
.task-info{flex:1;min-width:0}
.task-title{font-weight:700;font-size:.88rem;margin-bottom:3px}
.task-meta{font-size:.68rem;color:var(--dim)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border:none;border-radius:14px;font-size:.85rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;box-shadow:0 0 25px rgba(176,38,255,.4);cursor:pointer;pointer-events:auto}
.btn:active{transform:scale(.97)}
.btn-reset{background:transparent;border:2px solid rgba(255,0,229,.5);color:var(--pink);box-shadow:0 0 15px rgba(255,0,229,.2)}
.money-card{background:linear-gradient(135deg,rgba(0,255,136,.08),rgba(0,245,255,.05));border:1px solid rgba(0,255,136,.3);border-radius:18px;padding:24px 20px;margin-bottom:16px;text-align:center}
.money-total{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:8px 0;letter-spacing:-1px}
.money-sub{font-size:.7rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.history-item{background:var(--card2);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;border-left:3px solid var(--green)}
.history-item .date{color:var(--dim);font-size:.72rem}
.history-item .amount{font-weight:800;color:var(--green);text-shadow:0 0 10px rgba(0,255,136,.8)}
.week-day{background:var(--card2);border-radius:16px;padding:12px 16px;margin-bottom:10px;border:1px solid rgba(0,245,255,.12)}
.week-day.today{border-color:var(--cyan);box-shadow:0 0 25px rgba(0,245,255,.3)}
.week-day .day-title{font-weight:800;font-size:.82rem;margin-bottom:6px;text-transform:uppercase}
.week-day.today .day-title{color:var(--cyan);text-shadow:0 0 10px rgba(0,245,255,.8)}
.week-day .task-line{font-size:.76rem;color:var(--dim);padding:2px 0}
.empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:.82rem}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(150px);background:var(--card2);color:var(--cyan);padding:14px 26px;border-radius:30px;font-weight:800;font-size:.8rem;opacity:0;transition:all .4s;z-index:600;border:1px solid var(--cyan);box-shadow:0 0 30px rgba(0,245,255,.5);white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.money{color:var(--green);border-color:var(--green)}
.confetti{position:fixed;width:8px;height:8px;z-index:700;pointer-events:none;border-radius:50%;animation:fall 3s ease-in forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
.login-screen{position:fixed;inset:0;background:var(--bg);background-image:radial-gradient(circle at 20% 10%,rgba(176,38,255,.15) 0%,transparent 40%),radial-gradient(circle at 80% 90%,rgba(0,245,255,.12) 0%,transparent 40%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:500}
.login-box{width:100%;max-width:380px;background:var(--card);border-radius:28px;border:1px solid rgba(0,245,255,.15);box-shadow:0 0 60px rgba(176,38,255,.25);padding:32px 24px}
.login-box h2{font-size:1.4rem;font-weight:900;text-align:center;letter-spacing:3px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:24px}
.login-box input{width:100%;padding:14px 16px;background:var(--card2);border:1px solid rgba(0,245,255,.2);border-radius:12px;color:var(--text);font-size:.9rem;margin-bottom:12px;outline:none;font-family:inherit}
.login-box input:focus{border-color:var(--cyan);box-shadow:0 0 15px rgba(0,245,255,.3)}
.login-msg{font-size:.78rem;text-align:center;margin-top:12px;color:var(--dim);min-height:18px}
.login-msg.error{color:#ff4466}
.login-msg.success{color:var(--green)}
.powered{text-align:center;margin-top:20px;font-size:.68rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.powered b{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900;letter-spacing:2px}

/* Floating 3-dot button */
.fab-dots{position:absolute;bottom:16px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid rgba(0,245,255,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:100;box-shadow:0 0 20px rgba(0,245,255,.2);transition:all .2s;pointer-events:auto}
.fab-dots:active{transform:scale(.9)}
.fab-dots span{display:block;width:4px;height:4px;border-radius:50%;background:var(--cyan);margin:0 2px;box-shadow:0 0 8px var(--cyan)}
.fab-menu{position:absolute;bottom:70px;right:16px;z-index:110;display:none;flex-direction:column;gap:8px;pointer-events:auto}
.fab-menu.show{display:flex}
.fab-menu button{padding:12px 20px;border-radius:14px;border:2px solid rgba(0,245,255,.4);background:var(--card);color:var(--cyan);font-weight:800;font-size:.78rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 15px rgba(0,245,255,.2);white-space:nowrap}
.fab-menu button:active{transform:scale(.97)}
.fab-menu button.danger{border-color:rgba(255,68,102,.5);color:#ff4466;box-shadow:0 0 15px rgba(255,68,102,.2)}

/* Modal (Kinder verwalten) */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:800;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{width:100%;max-width:400px;max-height:85vh;background:var(--card);border-radius:24px;border:1px solid rgba(0,245,255,.25);box-shadow:0 0 60px rgba(176,38,255,.4);padding:22px 18px;display:flex;flex-direction:column}
.modal h3{font-size:1rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);text-align:center;margin-bottom:16px;text-shadow:0 0 10px rgba(0,245,255,.6)}
.kid-list{overflow-y:auto;margin-bottom:14px;flex:1}
.kid-item{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(0,245,255,.12);cursor:pointer;transition:all .2s}
.kid-item.active{border-color:var(--cyan);box-shadow:0 0 20px rgba(0,245,255,.3);background:rgba(0,245,255,.06)}
.kid-item .name{flex:1;font-weight:700;font-size:.9rem}
.kid-item.active .name{color:var(--cyan);text-shadow:0 0 8px rgba(0,245,255,.6)}
.kid-item .emoji{font-size:1.2rem}
.kid-item .del{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,68,102,.5);background:transparent;color:#ff4466;font-weight:900;font-size:.9rem;cursor:pointer;flex-shrink:0}
.kid-item .del:active{transform:scale(.9)}
.add-row{display:flex;gap:8px;margin-bottom:10px}
.add-row input{flex:1;padding:12px 14px;background:var(--card2);border:1px solid rgba(0,245,255,.2);border-radius:12px;color:var(--text);font-size:.85rem;outline:none;font-family:inherit;min-width:0}
.add-row input:focus{border-color:var(--cyan);box-shadow:0 0 15px rgba(0,245,255,.3)}
.add-row button{padding:12px 16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-weight:900;font-size:.85rem;cursor:pointer;box-shadow:0 0 20px rgba(176,38,255,.4);flex-shrink:0}
.add-row button:active{transform:scale(.95)}
.add-row button:disabled{opacity:.4;box-shadow:none}
.modal-close{width:100%;padding:12px;border-radius:14px;background:transparent;border:2px solid rgba(136,136,170,.4);color:var(--dim);font-weight:800;font-size:.8rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.modal-close:active{transform:scale(.97)}
.modal-hint{font-size:.7rem;color:var(--dim);text-align:center;margin-bottom:10px}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
<div class="login-box">
<h2>MY LIFE</h2>
<input type="email" id="loginEmail" placeholder="E-Mail" autocomplete="email">
<input type="password" id="loginPassword" placeholder="Passwort" autocomplete="current-password">
<button class="btn" id="loginBtn">Anmelden</button>
<button class="btn btn-reset" id="signupBtn" style="margin-top:8px">Neues Konto erstellen</button>
<div class="login-msg" id="loginMsg"></div>
<div class="powered">Powered by <b>M47ze</b></div>
</div>
</div>

<div class="app" id="app" style="display:none">
<header>
<h1>MY LIFE</h1>
<p>Ordnung - Haushalt - Routinen</p>
<div class="date" id="headerDate"></div>
<div class="kid-badge" id="kidBadge">Kind</div>
</header>
<div class="stats">
<div class="stat"><div class="value" id="statLevel">1</div><div class="label">Level</div></div>
<div class="stat"><div class="value" id="statPoints">0</div><div class="label">Punkte</div></div>
<div class="stat"><div class="value" id="statMoney">0€</div><div class="label">Verdient</div></div>
</div>
<div class="day-progress">
<div class="bar"><div class="fill" id="dayFill"></div></div>
<div class="text" id="dayText">0 von 0 Aufgaben erledigt</div>
</div>
<div class="euro-banner" id="euroBanner">ALLE AUFGABEN = 5&euro; F&Uuml;R MORGEN</div>
<div class="tabs" id="tabs">
<div class="tab active" data-tab="tasks">HEUTE</div>
<div class="tab" data-tab="money">GELD</div>
<div class="tab" data-tab="week">WOCHE</div>
</div>
<div class="content" id="content"></div>

<!-- Floating 3-dot button -->
<div class="fab-dots" id="fabDots"><span></span><span></span><span></span></div>
<div class="fab-menu" id="fabMenu">
<button id="manageKidsBtn">Kinder verwalten</button>
<button id="logoutBtn" class="danger">Abmelden</button>
</div>
</div>

<!-- Modal Kinder verwalten -->
<div class="modal-overlay" id="kidModal">
<div class="modal">
<h3>Kinder verwalten</h3>
<div class="modal-hint">Bis zu 5 Kinder pro Konto</div>
<div class="kid-list" id="kidList"></div>
<div class="add-row">
<input type="text" id="newKidName" placeholder="Name des Kindes" maxlength="20">
<button id="addKidBtn">+</button>
</div>
<button class="modal-close" id="closeKidModal">Schließen</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyByWz9WnPFydaoG_UacX4rWrlhFobUwyrM",
  authDomain: "mylife-app-af722.firebaseapp.com",
  databaseURL: "https://mylife-app-af722-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mylife-app-af722",
  storageBucket: "mylife-app-af722.firebasestorage.app",
  messagingSenderId: "1091690464149",
  appId: "1:1091690464149:web:0e2f0ee897e3c93bb96c9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

var TASK_TEMPLATES=[
{id:'zähne',title:'Zähne putzen',cat:'Hygiene',days:[0,1,2,3,4,5,6],important:true},
{id:'gesicht',title:'Gesicht waschen',cat:'Hygiene',days:[0,1,2,3,4,5,6],important:true},
{id:'bett',title:'Bett machen',cat:'Routine',days:[0,1,2,3,4,5,6],important:true},
{id:'hausaufgaben',title:'Hausaufgaben bearbeiten',cat:'Schule',days:[1,2,3,4,5,6]},
{id:'zimmer',title:'Zimmer aufräumen',cat:'Haushalt',days:[0]},
{id:'spülen',title:'Spülmaschine ein-/ausräumen',cat:'Küche',days:[1,3]},
{id:'wäsche',title:'Wäsche laufen lassen & verräumen',cat:'Haushalt',days:[2,4]}
];
var DAILY_REWARD_EUR=5;
var POINTS_PER_TASK=10;
var LEVEL_BASE=20;
var MAX_KIDS=5;
var KID_EMOJIS=['🧒','👦','👧','🧑','👶'];

// accountData = { kids: { kidId: state }, kidOrder: [kidId,...], activeKid: kidId }
var accountData=null;
var currentUser=null;
var currentTab='tasks';

function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function currentWeekday(){return new Date().getDay()}
function buildTodayTasks(){var wd=currentWeekday();var r=[];for(var i=0;i<TASK_TEMPLATES.length;i++){var t=TASK_TEMPLATES[i];if(t.days.indexOf(wd)!==-1){r.push({id:t.id,title:t.title,cat:t.cat,important:!!t.important,done:false})}}return r}
function defaultKidState(){return{tasks:buildTodayTasks(),today:todayKey(),points:0,totalPoints:0,level:1,earned:0,history:[],pointsToday:0}}
function calcLevel(totalPoints){if(totalPoints<LEVEL_BASE)return 1;return Math.floor(totalPoints/LEVEL_BASE)}
function genKidId(){return 'kid_'+Date.now()+'_'+Math.floor(Math.random()*10000)}
function activeKid(){if(!accountData||!accountData.activeKid)return null;return accountData.kids[accountData.activeKid]||null}
function activeKidName(){if(!accountData)return '';var k=accountData.kids[accountData.activeKid];return k&&k.name?k.name:'Kind'}

function defaultAccount(){
  var id=genKidId();
  var kids={};
  kids[id]={name:'Kind 1',emoji:'🧒',data:defaultKidState()};
  return {kids:kids,kidOrder:[id],activeKid:id};
}

// Migration: altes Format (flaches state-Objekt) -> neues Format
function migrateIfNeeded(data){
  if(!data)return null;
  if(data.kids && data.kidOrder && data.activeKid)return data;
  // altes Format
  var id=genKidId();
  var oldData={};
  // Aufgaben/Tagesreset-Logik auch hier anwenden
  var d=data;
  if(d.today!==todayKey()){
    var allDone=true;
    if(d.tasks){for(var i=0;i<d.tasks.length;i++){if(!d.tasks[i].done){allDone=false;break}}}
    if(allDone&&d.tasks&&d.tasks.length){
      d.earned=(d.earned||0)+DAILY_REWARD_EUR;
      d.history=d.history||[];
      d.history.unshift({date:d.today,amount:DAILY_REWARD_EUR});
    }
    d.tasks=buildTodayTasks();
    d.today=todayKey();
    d.pointsToday=0;
  }
  if(typeof d.pointsToday!=='number')d.pointsToday=0;
  if(typeof d.totalPoints!=='number')d.totalPoints=0;
  if(!d.tasks||!d.tasks.length)d.tasks=buildTodayTasks();
  d.level=calcLevel(d.totalPoints);
  oldData={tasks:d.tasks,today:d.today,points:d.points||0,totalPoints:d.totalPoints||0,level:d.level,earned:d.earned||0,history:d.history||[],pointsToday:d.pointsToday||0};
  var kids={};
  kids[id]={name:'Kind 1',emoji:'🧒',data:oldData};
  return {kids:kids,kidOrder:[id],activeKid:id};
}

// Tageswechsel-Behandlung pro Kind
function processKidDay(kidObj){
  var d=kidObj.data;
  if(d.today!==todayKey()){
    var allDone=true;
    if(d.tasks){for(var i=0;i<d.tasks.length;i++){if(!d.tasks[i].done){allDone=false;break}}}
    if(allDone&&d.tasks&&d.tasks.length){
      d.earned=(d.earned||0)+DAILY_REWARD_EUR;
      d.history=d.history||[];
      d.history.unshift({date:d.today,amount:DAILY_REWARD_EUR});
    }
    d.tasks=buildTodayTasks();
    d.today=todayKey();
    d.pointsToday=0;
  }
  if(typeof d.pointsToday!=='number')d.pointsToday=0;
  if(typeof d.totalPoints!=='number')d.totalPoints=0;
  if(!d.tasks||!d.tasks.length)d.tasks=buildTodayTasks();
  d.level=calcLevel(d.totalPoints);
}

function loadFromFirebase(uid){
  var userRef=ref(db,'users/'+uid);
  onValue(userRef,function(snapshot){
    var data=snapshot.val();
    if(!data){
      var fresh=defaultAccount();
      set(userRef,fresh);
      return;
    }
    var migrated=migrateIfNeeded(data);
    // Tageswechsel für alle Kinder prüfen
    for(var i=0;i<migrated.kidOrder.length;i++){
      var kid=migrated.kids[migrated.kidOrder[i]];
      if(kid)processKidDay(kid);
    }
    accountData=migrated;
    // Sicherstellen dass activeKid gültig ist
    if(!accountData.kids[accountData.activeKid]){
      accountData.activeKid=accountData.kidOrder[0];
    }
    // Falls Migration stattfand, zurückschreiben
    if(!data.kids)set(userRef,accountData);
    render();
  });
}

function saveToFirebase(){
  if(!currentUser||!accountData)return;
  set(ref(db,'users/'+currentUser.uid),accountData);
}
